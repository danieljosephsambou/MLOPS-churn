[project]
name = "mlops-churn"
version = "0.1.0"
description = "Squelette MLOps pédagogique de bout en bout (churn) — local, 100% open-source"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 : le pattern `Depends(...)` en valeur par défaut est idiomatique en FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
